name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: deploy-production # never two deploys at once
jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: ./deploy.sh staging "$GITHUB_SHA" # your hosting: build image, run migrations, start
      - run: ./smoke.sh https://staging.mawid.example # book, cancel, list: must pass in 60 s
  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production # protected environment: a person approves in GitHub
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy.sh production "$GITHUB_SHA"
      - run: ./smoke.sh https://mawid.example || ./deploy.sh production "$(cat .last-good-sha)" # automatic rollback
