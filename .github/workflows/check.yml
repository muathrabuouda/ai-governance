name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  governance:
    name: Multi-Stack Governance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node bin/governance.mjs check --profile=standard
      - run: node --test tests/core/governance-core.test.mjs
      - run: node scripts/check-deps.mjs
      - run: node scripts/scan-secrets.mjs
