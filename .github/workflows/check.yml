name: check
on: [pull_request]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci # installs exactly what the lockfile says
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n
      - run: npm run deps # pinned + approved + allowed licenses
      - run: npm run secrets # nothing that looks like a credential
      - run: npm audit --audit-level=high # known vulnerabilities
  mutation:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run mutate # slower: runs the suite once per mutant
